<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger Admin — user stats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,900&family=Public+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F6F1E7;--paper-2:#EFE7D5;--ink:#1A1E28;--ink-soft:#4B5263;--rule:#D8CDB4;--accent:#0E4D3C;--stamp-red:#C1272D;--amber:#B7791F;--shadow:4px 4px 0 var(--ink)}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Public Sans",sans-serif}
.wrap{max-width:920px;margin:0 auto;padding:24px 18px 80px}
h1{font-family:"Fraunces",serif;font-weight:900;margin:0 0 4px}
.mono{font-family:"IBM Plex Mono",monospace}
.card{border:2px solid var(--ink);border-radius:10px;background:var(--paper);box-shadow:var(--shadow);padding:16px;margin-top:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:14px}
.stat{border:2px solid var(--ink);border-radius:8px;background:var(--paper-2);padding:10px}
.stat b{font-family:"Fraunces",serif;font-size:30px;display:block;line-height:1}
.stat span{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-soft)}
input{border:2px solid var(--ink);border-radius:6px;background:var(--paper);color:var(--ink);padding:9px 10px;font-family:"IBM Plex Mono",monospace;font-size:13px;width:100%;margin-top:6px}
label{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.btn{border:2px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:8px;padding:10px 16px;font-family:"IBM Plex Mono",monospace;font-weight:600;cursor:pointer;box-shadow:3px 3px 0 var(--accent);margin-top:12px;min-height:48px}
table{width:100%;border-collapse:collapse;font-family:"IBM Plex Mono",monospace;font-size:12px;margin-top:8px}
th{text-align:left;border-bottom:2px solid var(--ink);padding:6px}td{border-bottom:1px solid var(--rule);padding:6px}
.err{border:2px solid var(--stamp-red);border-radius:6px;padding:10px;margin-top:12px;font-family:"IBM Plex Mono",monospace;font-size:12.5px;display:none}
.bar-row{display:flex;align-items:center;gap:8px;font-family:"IBM Plex Mono",monospace;font-size:12px;margin-top:6px}
.bar-track{flex:1;height:14px;border:2px solid var(--ink);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;background:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <div class="mono" style="font-size:11px;letter-spacing:.14em;color:var(--ink-soft)">ATTENDANCE LEDGER • ADMIN</div>
  <h1>User stats</h1>
  <div class="card">
    <label for="ep">Stats endpoint</label>
    <input id="ep" value="https://attendance-ledger-murex.vercel.app/api/stats" autocomplete="off">
    <label for="tok">Admin token</label>
    <input id="tok" type="password" placeholder="ADMIN_TOKEN from server env" autocomplete="off">
    <button class="btn" id="load">Load stats →</button>
    <div class="err" id="err"></div>
  </div>
  <div class="card" id="dash" style="display:none">
    <div class="grid" id="cards"></div>
    <h3 style="font-family:Fraunces,serif;margin:16px 0 4px">Platforms</h3>
    <div id="plats"></div>
    <h3 style="font-family:Fraunces,serif;margin:16px 0 4px">Recent installs</h3>
    <div style="overflow:auto"><table><thead><tr><th>ID</th><th>PLAT</th><th>V</th><th>SUBJ</th><th>MARKS</th><th>LAST SEEN</th></tr></thead><tbody id="rows"></tbody></table></div>
  </div>
  <p class="mono" style="font-size:11px;color:var(--ink-soft);margin-top:20px">Counts only opt-in installs. IDs are random, truncated to 8 chars — no personal data exists to leak.</p>
</div>
<script>
const $=id=>document.getElementById(id);
$("ep").value=localStorage.getItem("ledger_admin_ep")||$("ep").value;
$("tok").value=localStorage.getItem("ledger_admin_tok")||"";
$("load").onclick=async()=>{
  const ep=$("ep").value.trim(), tok=$("tok").value;
  localStorage.setItem("ledger_admin_ep",ep); localStorage.setItem("ledger_admin_tok",tok);
  const err=$("err"); err.style.display="none";
  try{
    const r=await fetch(ep,{headers:{Authorization:"Bearer "+tok}});
    if(r.status===401) throw new Error("wrong token (401)");
    if(r.status===501) throw new Error("server not configured — set SUPABASE_URL / SERVICE_KEY / ADMIN_TOKEN env");
    if(!r.ok) throw new Error("server "+r.status);
    const d=await r.json(); if(!d.ok) throw new Error("bad payload");
    $("dash").style.display="";
    $("cards").innerHTML=[["Installs",d.total],["Active 7d",d.active7],["Active 30d",d.active30],["Avg subjects",d.avgSubjects],["Total marks",d.totalMarks]]
      .map(([k,v])=>`<div class="stat"><b>${v}</b><span>${k}</span></div>`).join("");
    const mp=Math.max(1,...Object.values(d.platforms),1);
    $("plats").innerHTML=Object.entries(d.platforms).map(([k,v])=>
      `<div class="bar-row"><span style="width:70px">${k}</span><div class="bar-track"><div class="bar-fill" style="width:${v/mp*100}%"></div></div><b>${v}</b></div>`).join("")||"—";
    $("rows").innerHTML=d.recent.map(r=>`<tr><td>${r.id}</td><td>${r.platform}</td><td>${r.v}</td><td>${r.subjects}</td><td>${r.marks}</td><td>${String(r.last).slice(0,10)}</td></tr>`).join("");
  }catch(e){err.textContent="Load failed: "+e.message;err.style.display=""}
};
</script>
</body>
</html>
